<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Specimen Viewer</title>
  <link rel="stylesheet" href="assets/style.css">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>

<body class="viewer-page">
  <header class="masthead">
    <h1 id="site-title">Specimen Index</h1>
    <div class="masthead-right">
      <button id="lang-toggle" class="lang-btn"></button>
      <!--
      <button id="place-mode-btn" class="pin-btn"
        title="Placement mode: click the model to get coordinates for a new hotspot">📍</button>
      -->
    </div>
  </header>

  <a class="back-link" href="index.html" id="back-link"></a>

  <div class="viewer-shell">
    <model-viewer id="mv" camera-controls touch-action="pan-y" auto-rotate auto-rotate-delay="1500"
      interaction-prompt="none" exposure="1" shadow-intensity="0.6" ar
      ar-modes="webxr scene-viewer quick-look"></model-viewer>

    <div id="hotspot-panel" class="hotspot-panel">
      <button id="hotspot-panel-close" class="hotspot-panel-close">✕</button>
      <h3 id="hotspot-panel-title"></h3>
      <p id="hotspot-panel-text"></p>
    </div>
  </div>
  <!--
  <div id="place-readout" class="place-readout"></div>
  -->
  <div class="label-plate">
    <h1 id="title">Loading…</h1>
    <p class="desc" id="desc"></p>
    <p class="hint" id="hint"></p>
  </div>

  <script src="assets/i18n.js"></script>
  <script src="assets/viewer.js"></script>
</body>

</html>
