<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Specimen Viewer</title>
<link rel="stylesheet" href="assets/style.css">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body class="viewer-page">
  <header class="masthead">
    <h1>Specimen Index</h1>
    <span class="tag" id="crumb"></span>
  </header>

  <a class="back-link" href="index.html">&larr; back to index</a>

  <model-viewer
    id="mv"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    auto-rotate-delay="1500"
    interaction-prompt="none"
    exposure="1"
    shadow-intensity="0.6"
    ar
    ar-modes="webxr scene-viewer quick-look"
  ></model-viewer>

  <div class="label-plate">
    <h1 id="title">Loading…</h1>
    <p class="desc" id="desc"></p>
    <p class="hint">Drag to rotate · pinch to zoom · tap the AR icon on a phone to place it in your room.</p>
  </div>

  <script src="assets/viewer.js"></script>
</body>
</html>
